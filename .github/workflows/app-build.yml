name: App build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted macOS runner
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-26]
  push:
    branches: ['ci/app-build-*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.scheme }} (${{ matrix.platform }})
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scheme: [a-Shell-noPython, a-Shell-mini, a-Shell]
        platform: [device, simulator]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.21'
      - name: Check toolchain and SwiftPM manifest
        run: |
          xcodebuild -version
          uv run ci/build-app.py package --check
      - name: Build unsigned app from pinned frameworks
        shell: bash
        env:
          SCHEME: ${{ matrix.scheme }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          status=0
          uv run ci/build-app.py build "$SCHEME" "$PLATFORM" || status=$?
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/app-build-summary.md"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: app-build-${{ matrix.scheme }}-${{ matrix.platform }}-summary
          path: ${{ runner.temp }}/app-build-summary.md
          if-no-files-found: error
